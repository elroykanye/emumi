name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev
      - name: Verify Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Ensure bundled frontend is current
        run: git diff --exit-code -- web
      - name: Verify manager HTTP wire
        run: |
          cargo build
          bash ./tests/manager_wire.sh
      - name: Build Debian package
        run: ./scripts/package-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: emumi-${{ github.sha }}
          path: |
            dist/emumi_*.deb
            dist/emumi_*.deb.sha256
          if-no-files-found: error
